<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Captain Dezca Famz EV Rent</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Arial, sans-serif; }
    
    body { 
        background: #0f172a; 
        min-height: 100vh; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        padding: 15px; 
    }
    
    .container { 
        background: #fff; 
        border-radius: 20px; 
        box-shadow: 0 25px 50px -12px rgba(0,0,0,.5); 
        width: 100%; 
        max-width: 450px; 
        overflow: hidden; 
    }
    
    /* HEADER CYAN */
    .header { 
        background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%); 
        color: #fff; 
        padding: 25px 20px; 
        text-align: center; 
    }
    
    .header h1 { 
        font-size: 20px; 
        font-weight: 800; 
        letter-spacing: 1px; 
        text-transform: uppercase; 
    }
    
    .header p { 
        font-size: 12px; 
        opacity: .9; 
        margin-top: 4px; 
        letter-spacing: 1px; 
    }

    .content { padding: 25px; }

    .form-group { margin-bottom: 15px; }
    
    .form-group label { 
        display: block; 
        font-size: 12px; 
        font-weight: 700; 
        color: #4b5563; 
        text-transform: uppercase; 
        letter-spacing: .5px; 
        margin-bottom: 8px; 
    }
    
    .form-group input { 
        width: 100%; 
        padding: 12px 14px; 
        border: 2px solid #e5e7eb; 
        border-radius: 12px; 
        font-size: 16px; 
        font-weight: 700;
        color: #1e3c72;
        background: #f9fafb; 
        transition: .2s; 
    }
    
    .form-group input:focus { 
        outline: none; 
        border-color: #06b6d4; 
        background: #fff;
        box-shadow: 0 0 0 4px rgba(6,182,212,.1); 
    }

    /* Tampilan Argo Digital */
    .argo-box {
        background: #0f2027;
        border-radius: 16px;
        padding: 20px;
        text-align: center;
        margin-top: 25px;
        margin-bottom: 20px;
        box-shadow: inset 0 0 20px rgba(6,182,212,.3);
        position: relative;
        overflow: hidden;
    }

    .argo-box::before {
        content: '';
        position: absolute;
        top: -50%;
        right: -30%;
        width: 200px;
        height: 200px;
        background: radial-gradient(circle, rgba(6,182,212,.4), transparent 70%);
        border-radius: 50%;
    }

    .argo-box .label {
        font-size: 11px;
        color: #94a3b8;
        letter-spacing: 2px;
        text-transform: uppercase;
        position: relative;
        z-index: 1;
    }

    .argo-box .harga {
        font-size: 40px;
        font-weight: 900;
        color: #06b6d4;
        line-height: 1;
        margin-top: 5px;
        text-shadow: 0 0 20px rgba(6,182,212,.6);
        position: relative;
        z-index: 1;
        font-variant-numeric: tabular-nums;
    }

    .argo-box .harga .currency {
        font-size: 18px;
        vertical-align: super;
    }

    .argo-box .rincian {
        font-size: 12px;
        color: #cbd5e1;
        margin-top: 10px;
        position: relative;
        z-index: 1;
        background: rgba(255,255,255,.1);
        display: inline-block;
        padding: 4px 12px;
        border-radius: 20px;
        line-height: 1.6;
    }

    /* TOMBOL RESET */
    .btn-group {
        display: flex;
        margin-bottom: 10px;
    }

    .btn { 
        flex: 1;
        padding: 14px; 
        border: none; 
        border-radius: 12px; 
        font-size: 14px; 
        font-weight: 800; 
        cursor: pointer; 
        transition: .2s; 
        text-transform: uppercase; 
        letter-spacing: 1px; 
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
    }
    
    .btn-reset { 
        background: #f3f4f6; 
        color: #4b5563; 
        border: 2px solid #e5e7eb;
    }
    
    .btn-reset:hover { 
        background: #e5e7eb; 
    }

    /* TOMBOL PEMBAYARAN */
    .payment-group {
        display: flex;
        gap: 10px;
        margin-top: 10px;
        padding-top: 15px;
        border-top: 2px dashed #e5e7eb;
    }

    /* Tombol Tunai (Hijau) */
    .btn-cash {
        background: linear-gradient(135deg, #10b981, #059669);
        color: #fff;
        box-shadow: 0 4px 14px rgba(16,185,129,.4);
    }
    .btn-cash:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(16,185,129,.6);
    }

    /* Tombol QRIS (Orange) */
    .btn-qris {
        background: linear-gradient(135deg, #f97316, #ea580c);
        color: #fff;
        box-shadow: 0 4px 14px rgba(249,115,22,.4);
    }
    .btn-qris:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(249,115,22,.6);
    }

    /* ==========================================
       CSS UNTUK POP-UP (MODAL) QRIS
       ========================================== */
    .modal-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0, 0, 0, 0.8);
        z-index: 9999;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .modal-overlay.active {
        display: flex;
    }

    .modal-content {
        background: #fff;
        border-radius: 16px;
        padding: 20px;
        width: 100%;
        max-width: 350px;
        text-align: center;
        position: relative;
        animation: popIn 0.3s ease-out;
    }

    @keyframes popIn {
        from { transform: scale(0.9); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }

    .modal-content h2 {
        font-size: 18px;
        color: #1e3c72;
        margin-bottom: 5px;
        text-transform: uppercase;
    }

    .modal-content p {
        font-size: 13px;
        color: #6b7280;
        margin-bottom: 15px;
    }

    .modal-content img {
        width: 100%;
        max-width: 280px;
        border-radius: 12px;
        border: 2px solid #e5e7eb;
        margin-bottom: 15px;
        display: block;
        margin-left: auto;
        margin-right: auto;
    }

    .btn-close-modal {
        background: #ef4444;
        color: #fff;
        padding: 12px;
        border: none;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        width: 100%;
        margin-bottom: 8px;
    }

    .btn-close-modal:hover { background: #dc2626; }

    .btn-download-qr {
        background: #3b82f6;
        color: #fff;
        padding: 12px;
        border: none;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        width: 100%;
        text-decoration: none;
        display: block;
    }

    .btn-download-qr:hover { background: #2563eb; }
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Captain Dezca Famz EV Rent</h1>
        <p>Layanan Sewa Mobil & Taksi Listrik</p>
    </div>

    <div class="content">
        <div class="form-group">
            <label>Jarak Tempuh (KM)</label>
            <input type="number" id="jarakInput" placeholder="Contoh: 12.5" min="0" step="0.1" oninput="hitungArgo()">
        </div>

        <div class="form-group">
            <label>Biaya Tol (Rp)</label>
            <input type="number" id="tolInput" placeholder="0" min="0" step="500" oninput="hitungArgo()">
        </div>

        <div class="form-group">
            <label>Biaya Parkir (Rp)</label>
            <input type="number" id="parkirInput" placeholder="0" min="0" step="500" oninput="hitungArgo()">
        </div>

        <div class="argo-box">
            <div class="label">TOTAL KESELURUHAN</div>
            <div class="harga"><span class="currency">Rp</span> <span id="totalArgo">0</span></div>
            <div class="rincian" id="rincianText">
                Argo: Rp 0<br>
                Tol/Parkir: Rp 0
            </div>
        </div>

        <!-- TOMBOL RESET -->
        <div class="btn-group">
            <button class="btn btn-reset" onclick="resetForm()">Reset</button>
        </div>

        <!-- TOMBOL PEMBAYARAN -->
        <div class="payment-group">
            <button class="btn btn-cash" onclick="bayarTunai()">💵 Tunai</button>
            <button class="btn btn-qris" onclick="bayarQris()">📱 QRIS</button>
        </div>
    </div>
</div>

<!-- ==========================================
     POP-UP (MODAL) QRIS
     ========================================== -->
<div class="modal-overlay" id="qrisModal">
    <div class="modal-content">
        <h2>Scan QRIS</h2>
        <p>Silakan scan menggunakan aplikasi M-Banking atau E-Wallet Anda</p>
        
        <!-- FOTO QRIS ANDA -->
        <img src="https://static.iimg.live/uploads/incredible-picture-7616.jpeg" alt="QRIS Captain Dezca Famz" id="qrisImage">
        
        <p style="font-size: 16px; font-weight: 800; color: #0f9b0f; margin-bottom: 15px;">
            Total: Rp <span id="modalTotalQris">0</span>
        </p>

        <button class="btn-close-modal" onclick="tutupModalQris()">Tutup</button>
        <!-- Tombol unduh agar pelanggan bisa simpan ke galeri -->
        <a href="https://static.iimg.live/uploads/incredible-picture-7616.jpeg" class="btn-download-qr" id="btnDownloadQr" target="_blank" download="QRIS_CaptainDezca.jpeg">⬇️ Simpan Gambar QRIS</a>
    </div>
</div>

<script>
    // Konfigurasi Tarif
    const TARIF_PER_KM = 4200;

    function hitungArgo() {
        const jarak = parseFloat(document.getElementById('jarakInput').value) || 0;
        const tol = parseFloat(document.getElementById('tolInput').value) || 0;
        const parkir = parseFloat(document.getElementById('parkirInput').value) || 0;

        const biayaArgo = jarak * TARIF_PER_KM;
        const total = biayaArgo + tol + parkir;

        const argoFormat = Math.round(biayaArgo).toLocaleString('id-ID');
        const totalFormat = Math.round(total).toLocaleString('id-ID');
        
        document.getElementById('totalArgo').textContent = totalFormat;
        
        const rincianEl = document.getElementById('rincianText');
        rincianEl.innerHTML = `
            Argo: Rp ${argoFormat}<br>
            Tol/Parkir: Rp ${Math.round(tol + parkir).toLocaleString('id-ID')}
        `;
    }

    function resetForm() {
        document.getElementById('jarakInput').value = '';
        document.getElementById('tolInput').value = '';
        document.getElementById('parkirInput').value = '';
        hitungArgo();
    }

    // Fungsi Pembayaran Tunai
    function bayarTunai() {
        const total = document.getElementById('totalArgo').textContent;
        if (total === "0") {
            alert('Belum ada tagihan yang dihitung.');
            return;
        }
        
        const konfirmasi = confirm(`Pembayaran Tunai sebesar Rp ${total} berhasil.\n\nKlik OK untuk mereset form.`);
        if (konfirmasi) {
            resetForm();
            alert('Transaksi selesai! Form telah direset untuk penumpang berikutnya.');
        }
    }

    // Fungsi Pembayaran QRIS (Memunculkan Modal)
    function bayarQris() {
        const total = document.getElementById('totalArgo').textContent;
        if (total === "0") {
            alert('Belum ada tagihan yang dihitung.');
            return;
        }

        // Set total ke dalam modal
        document.getElementById('modalTotalQris').textContent = total;

        // Tampilkan modal
        document.getElementById('qrisModal').classList.add('active');
    }

    // Fungsi Menutup Modal QRIS
    function tutupModalQris() {
        document.getElementById('qrisModal').classList.remove('active');
    }
</script>

</body>
</html>
